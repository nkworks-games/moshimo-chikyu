<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<meta name="description" content="出来事カードをえらんで、1分で自分だけの地球をつくるゲーム。できた星には称号がつき、人口・気温・雨・国・くらしの地図も見られます。あなたの星は、何の星？">
<meta name="theme-color" content="#060a17">
<title>もしもの地球</title>
<meta property="og:type" content="website">
<meta property="og:title" content="もしもの地球">
<meta property="og:description" content="カードをえらんで、1分で自分だけの地球をつくるゲーム。できた星の称号は？ 人口や国の地図も見られる。">
<meta property="og:url" content="https://nkworks-games.com/moshimo-chikyu/">
<meta property="og:image" content="https://nkworks-games.com/moshimo-chikyu/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* レイアウト：上に星（地図／地球儀）の舞台、下にカード。横長の画面では左に舞台、右にカード。夜空の中に星が浮かぶ1画面のアプリ */
:root {
  color-scheme: dark;
  --space: #060a17;        /* 夜空 */
  --panel: #101938;        /* カードやパネルの地 */
  --panel-hi: #1a2650;     /* 選んだカードの地 */
  --ink: #f2f5ff;          /* 文字 */
  --dim: #a9b4d6;          /* 弱い文字 */
  --line: #2b396b;         /* 枠線 */
  --gold: #ffd071;         /* 主役の色（太陽の光） */
  --gold-ink: #2b1d00;     /* 金色の上の文字 */
  --sea: #6cc4f5;          /* 補助の色（海） */
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
}
html { height: 100%; box-sizing: border-box; }
body { word-break: auto-phrase; height: 100%; margin: 0; background: var(--space); color: var(--ink); font-family: var(--body); font-weight: 500; font-size: 14px; line-height: 1.5; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { position: relative; height: 100%; box-sizing: border-box; max-width: 1180px; margin-inline: auto; padding-inline: 16px; padding-block: 6px 12px; display: flex; flex-direction: column; gap: 6px; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; pointer-events: none; }
.top, .layout { position: relative; z-index: 1; }
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
  radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 31% 64%, #cfe0ff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 47% 9%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 58% 41%, #ffe9c2 50%, transparent 51%), radial-gradient(1px 1px at 73% 77%, #fff 50%, transparent 51%), radial-gradient(1.5px 1.5px at 86% 23%, #cfe0ff 50%, transparent 51%),
  radial-gradient(1px 1px at 93% 58%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 6% 83%, #ffe9c2 50%, transparent 51%), radial-gradient(1px 1px at 22% 40%, #fff 50%, transparent 51%),
  radial-gradient(1px 1px at 66% 92%, #cfe0ff 50%, transparent 51%), radial-gradient(1px 1px at 39% 30%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 80% 50%, #fff 50%, transparent 51%),
  radial-gradient(120% 70% at 50% 110%, #16224f 0%, transparent 60%), var(--space); opacity: .9; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .06em; color: var(--dim); transition: opacity .3s; }
[data-screen="title"] .brand { opacity: 0; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }

.layout { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
/* カードを選ぶ間は、舞台を地図ぴったりの高さにして、残りをカードに使う */
[data-screen="play"] .stage, [data-screen="finish"] .stage { flex: 0 1 auto; height: calc((min(100vw, 1180px) - 32px) / 2 + 74px); }
.stage { position: relative; flex: 1 1 auto; min-height: 150px; touch-action: none; -webkit-user-select: none; user-select: none; }
.stage-top, .stage-bottom { position: absolute; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
.stage-top { top: 0; align-items: center; gap: 12px; min-height: 28px; } .stage-bottom { bottom: 0; }
/* 「これで完成」：5回より少なくても、ここで完成にできる（見た目は小さいが、押せる範囲は上と左右に少し広い。下は地図なので広げない） */
.done-btn { pointer-events: auto; position: relative; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 700; white-space: nowrap; transition: opacity .2s; }
.done-btn::before { content: ""; position: absolute; inset: -7px -8px -1px; }
.done-btn:active { transform: translateY(1px) scale(.97); }
.done-btn:disabled { opacity: .4; cursor: default; }
.turns { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--dim); font-variant-numeric: tabular-nums; }
.turns b { color: var(--ink); font-weight: 900; }
.pips { display: flex; gap: 5px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); box-sizing: border-box; }
.pips i.done { background: var(--gold); border-color: var(--gold); }
.pips i.now { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 208, 113, .22); }
.hint { margin: 0; padding: 5px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; text-align: center; background: rgba(6, 10, 23, .72); color: var(--ink); max-width: 100%; box-sizing: border-box; text-wrap: balance; }
.hint.pop { animation: hintPop .35s ease-out; }
@keyframes hintPop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

.panel { flex: 0 0 auto; min-width: 0; }
.panel-h { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--dim); letter-spacing: .04em; }

/* ---- タイトル ---- */
.p-title { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-block: 4px 10px; }
.title { margin: 0; font-family: var(--display); font-weight: 800; line-height: 1.12; letter-spacing: .04em; display: flex; flex-direction: column; align-items: center; }
.title .t1 { font-size: clamp(20px, 6vw, 30px); color: var(--gold); }
.title .t2 { font-size: clamp(34px, 11vw, 60px); text-wrap: balance; }
.lead { margin: 0; color: var(--dim); font-size: 14px; max-width: 30em; }
.lead span { display: block; } .lead i { font-style: normal; display: inline-block; } .award-desc span { display: inline-block; }   /* 文の切れ目で改行する */

/* ---- ボタン ---- */
.btn { min-height: 46px; padding: 8px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; font-size: 15px; transition: transform .08s, background .15s, opacity .2s; }
.btn:active { transform: translateY(1px) scale(.985); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 900; }
.btn.big { min-height: 56px; min-width: 220px; font-size: 20px; border-radius: 16px; letter-spacing: .08em; }
.btn:disabled { opacity: .45; cursor: default; }

/* ---- カード ---- */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { position: relative; display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 1dvh, 9px); min-width: 0; min-height: clamp(148px, 30dvh, 236px); padding: clamp(10px, 2dvh, 18px) 7px clamp(9px, 1.6dvh, 14px); border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); text-align: center; transition: transform .12s, border-color .12s, background .12s, opacity .2s; animation: cardIn .34s cubic-bezier(.2, .9, .3, 1.2) backwards; }
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
@keyframes cardIn { from { transform: translateY(14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.card-ico { width: clamp(42px, 8dvh, 62px); height: clamp(42px, 8dvh, 62px); border-radius: 50%; display: grid; place-items: center; background: #0a1128; color: var(--sea); flex: none; }
.card-ico svg { width: 58%; height: 58%; }
.card-name { font-size: clamp(15px, 2.3dvh, 18px); font-weight: 900; letter-spacing: .02em; }
.card-desc { font-size: clamp(11.5px, 1.75dvh, 13.5px); line-height: 1.45; color: var(--dim); flex: 1; }
.card-tag { font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.card-again { position: absolute; top: -7px; right: -4px; font-size: 10.5px; font-weight: 900; line-height: 1; padding: 4px 7px; border-radius: 999px; background: var(--gold); color: var(--gold-ink); letter-spacing: .02em; }
.card[aria-pressed="true"] { border-color: var(--gold); background: var(--panel-hi); transform: translateY(-4px); }
.card[aria-pressed="true"] .card-ico { color: var(--gold); }
.card[aria-pressed="true"] .card-tag { border-color: var(--gold); color: var(--gold); }
.cards.locked .card { opacity: .38; pointer-events: none; }
.cards.locked .card[aria-pressed="true"] { opacity: 1; }

/* ---- 結果 ---- */
.p-result { display: flex; flex-direction: column; gap: 8px; }
[data-screen="finish"] .p-result { min-height: clamp(148px, 30dvh, 236px); justify-content: center; }   /* しるしと称号を出す間は、カードがあった分の高さを空けておく（地図が動かないように） */
.ghost { visibility: hidden; pointer-events: none; }                                                     /* 場所だけ取っておく（あとで出てくる部品） */
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 12px; color: var(--dim); min-height: 20px; }
.legend li { display: flex; align-items: center; gap: 5px; animation: hintPop .3s ease-out; }
.legend svg { width: 14px; height: 14px; flex: none; }
.legend.tall { min-height: 40px; align-content: center; }      /* 結果画面：2行ぶんの高さを取っておく（地図の種類を変えても、星の大きさが変わらないように） */
.legend b { color: var(--ink); font-weight: 900; }
.legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; box-sizing: border-box; border: 1px solid rgba(255, 255, 255, .28); }
.legend .sws { display: inline-flex; gap: 2px; }
.legend .bar { width: clamp(64px, 20vw, 120px); height: 9px; border-radius: 999px; flex: none; border: 1px solid rgba(255, 255, 255, .18); box-sizing: border-box; }
/* 地図の種類（地形・人口・気温・雨・国・くらし） */
.layers { display: flex; gap: 4px; }
.layer-btn { flex: 3.2 1 0; min-width: 0; min-height: 34px; padding: 0 1px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 700; color: var(--dim); white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.layer-btn[aria-pressed="true"] { background: var(--panel-hi); border-color: var(--gold); color: var(--gold); }
.layer-btn[data-k="rain"], .layer-btn[data-k="nation"] { flex-grow: 2.2; } .layer-btn[data-k="life"] { flex-grow: 4.2; }      /* 字数に合わせた幅（せまい画面でも「くらし」が入るように） */
.layer-btn:active { transform: translateY(1px); }
.award-box { text-align: center; }
.kicker { margin: 0; font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .12em; }
.award { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 9.5vw, 46px); line-height: 1.2; color: var(--gold); letter-spacing: .04em; text-wrap: balance; }
.award-desc { margin: 2px 0 0; font-size: 14px; text-wrap: balance; }
.reveal { animation: awardIn .7s cubic-bezier(.2, .9, .25, 1.15) backwards; }
@keyframes awardIn { from { transform: scale(.7); opacity: 0; letter-spacing: .3em; } to { transform: none; opacity: 1; } }
.name-row { display: flex; flex-direction: column; gap: 3px; }
.name-row label { font-size: 12px; color: var(--dim); font-weight: 700; }
.name-row input { min-height: 42px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0a1128; font-size: 16px; font-weight: 700; min-width: 0; }
.name-row input::placeholder { color: #6f7ba3; font-weight: 500; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .primary { grid-column: 1 / -1; }
.fade-in { animation: hintPop .4s ease-out backwards; }
/* 地球儀 ⇔ 地図 の切りかえボタン（置き場所は、地球儀や地図の右下に合わせてプログラムが決める） */
.view-btn { position: absolute; left: 0; top: 0; z-index: 2; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px 0 11px; border-radius: 999px; border: 1px solid var(--line); background: rgba(16, 25, 56, .94); font-size: 13px; font-weight: 700; white-space: nowrap; animation: hintPop .4s ease-out backwards; }
.view-btn:active { transform: translateY(1px) scale(.97); }
.view-btn svg { width: 17px; height: 17px; flex: none; color: var(--gold); }
.view-btn .l { display: none; }
[data-screen="result"] .stage-bottom { bottom: auto; top: 0; }      /* 結果画面の案内（「回せます」）は、舞台の上のはしに出す（右下のボタンに重ならないように） */
@media (min-width: 560px) { .view-btn .s { display: none; } .view-btn .l { display: inline; } }

.toast { pointer-events: none; position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(90vw, 420px); padding: 9px 16px; border-radius: 12px; background: #f2f5ff; color: #10162c; font-weight: 700; font-size: 13px; text-align: center; z-index: 5; box-shadow: 0 6px 24px rgba(0, 0, 0, .45); animation: hintPop .25s ease-out; }

/* ---- 横長の画面（パソコンなど）：左に大きな地図、右にカード ---- */
@media (min-aspect-ratio: 5/4) {
  #app { max-width: 1720px; padding-block: 10px 16px; --side: clamp(240px, 30vw, 440px); }
  .layout { flex-direction: row; align-items: stretch; gap: 22px; }
  /* 地図ぴったりの高さにして上下の中央へ（「あと◯回」と案内が地図のすぐ上下に来る） */
  [data-screen="unwrap"] .stage, [data-screen="play"] .stage, [data-screen="finish"] .stage { flex: 1 1 auto; align-self: center; height: calc((min(100vw, 1720px) - 54px - var(--side)) / 2 + 74px); max-height: 100%; }
  .panel { flex: 0 0 var(--side); align-self: center; }
  .cards { grid-template-columns: 1fr; gap: clamp(6px, 1.4dvh, 12px); }
  .card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "ico name tag" "ico desc desc"; align-items: center; text-align: left; min-height: 0; padding: clamp(7px, 1.7dvh, 16px) 14px; column-gap: 12px; row-gap: 2px; }
  .card-ico { grid-area: ico; width: clamp(34px, 7.4dvh, 64px); height: clamp(34px, 7.4dvh, 64px); }
  .card-name { grid-area: name; font-size: clamp(15px, 2.6dvh, 22px); }
  .card-desc { grid-area: desc; font-size: clamp(11.5px, 1.9dvh, 15.5px); }
  .card-tag { grid-area: tag; }
  .card[aria-pressed="true"] { transform: translateX(-6px); }
  .p-title { align-items: flex-start; text-align: left; gap: clamp(8px, 2.2dvh, 18px); }
  .title { align-items: flex-start; } .title .t1 { font-size: clamp(18px, 2.3vw, 34px); } .title .t2 { font-size: clamp(34px, 4.6vw, 66px); white-space: nowrap; }
  .lead { font-size: clamp(13px, 1.25vw, 17px); }
  .btn.big { min-width: min(220px, 100%); }
  [data-screen="finish"] .p-result { min-height: 0; }
  .award-box, .legend { text-align: left; justify-content: flex-start; }
  .award { font-size: clamp(30px, 4.4vw, 62px); white-space: nowrap; } .award-desc { font-size: clamp(13px, 1.25vw, 17px); }
  .legend { font-size: clamp(12px, 1.1vw, 14px); }
  .hint { font-size: clamp(13px, 1.2vw, 16px); } .turns { font-size: clamp(13px, 1.2vw, 16px); } .done-btn { font-size: clamp(12.5px, 1.05vw, 14px); }
}
/* 横長で背が低い画面（スマホを横向きにした時など） */
@media (min-aspect-ratio: 5/4) and (max-height: 480px) {
  #app { padding-block: 4px 8px; gap: 2px; } .top { min-height: 32px; } .icon-btn { width: 32px; height: 32px; }
  .btn { min-height: 38px; padding-block: 4px; } .btn.big { min-height: 46px; font-size: 17px; } .name-row input { min-height: 36px; padding-block: 3px; }
  .hint { font-size: 12px; padding: 4px 10px; }
  .card-again { right: auto; left: -4px; top: -6px; }      /* せまいので、右上の「場所をえらぶ」に重ならないよう左上へ */
  .p-result { gap: 4px; } .kicker { display: none; } .award-desc { margin-top: 0; line-height: 1.35; } .name-row label { font-size: 11px; }
  .actions { grid-template-columns: 1fr 1fr 1.15fr; gap: 6px; } .actions .primary { grid-column: auto; } .actions .btn { padding-inline: 4px; font-size: 14px; } .actions .l { display: none; }      /* ボタン3つを1列に（「画像を保存」は短く「保存」） */
  .layer-btn { min-height: 30px; } .legend.tall { min-height: 36px; }
}
/* 縦長で背が低い画面 */
@media (max-height: 560px) and (max-aspect-ratio: 1249/1000) { .card { min-height: 126px; } .card-ico { width: 36px; height: 36px; } }
/* 縦長で、あまり背が高くない画面（小さめのスマホ）：結果画面のボタン3つを1列にして、そのぶん星を大きく見せる */
@media (max-height: 700px) and (max-aspect-ratio: 1249/1000) { .actions { grid-template-columns: 1fr 1fr 1.15fr; gap: 6px; } .actions .primary { grid-column: auto; } .actions .btn { padding-inline: 4px; } }
@media (prefers-reduced-motion: reduce) { .card, .hint.pop, .legend li, .reveal, .fade-in, .toast, .view-btn { animation: none; } .layer-btn, .done-btn { transition: none; } }
</style>

<body>
<div id="app" data-screen="title">
  <div class="sky" aria-hidden="true"></div>
  <canvas id="view" role="img" aria-label="星の地図"></canvas>
  <header class="top">
    <div class="brand">もしもの地球</div>
    <button id="btnMute" class="icon-btn" type="button" aria-label="音を消す" aria-pressed="false"></button>
  </header>
  <main class="layout">
    <div class="stage" id="stage">
      <div class="stage-top"><div class="turns" id="turns" hidden></div><button id="btnDone" class="done-btn" type="button" hidden>これで完成</button></div>
      <div class="stage-bottom"><p class="hint" id="hint" aria-live="polite" hidden></p></div>
      <button id="btnView" class="view-btn" type="button" hidden></button>
    </div>
    <aside class="panel" id="panel">
      <section class="p-title" id="pTitle">
        <h1 class="title"><span class="t1">1分でつくる</span><span class="t2">もしもの地球</span></h1>
        <p class="lead"><span><i>出来事カードを5回までえらんで、</i><i>星をつくろう。</i></span><span><i>完成した星には称号がつきます</i><i>（全10種類）。</i></span></p>
        <button id="btnStart" class="btn primary big" type="button" disabled>はじめる</button>
      </section>
      <section class="p-play" id="pPlay" hidden>
        <div class="cards" id="cards"></div>
      </section>
      <section class="p-result" id="pResult" hidden>
        <div class="layers" id="layers" role="group" aria-label="地図の種類" hidden></div>
        <ul class="legend" id="legend" aria-label="地図の見方"></ul>
        <div class="award-box" id="awardBox" hidden>
          <p class="kicker" id="kicker">この星の称号</p>
          <h2 class="award" id="award"></h2>
          <p class="award-desc" id="awardDesc"></p>
        </div>

<script>

      rain: new Float32Array(N), temp: new Float32Array(N), filled: new Float32Array(N), down: new Int32Array(N), acc: new Float32Array(N), lake: new Uint8Array(N), order: new Int32Array(N), nOrder: 0,

  onTap(elView, toggleView);
  onTap(elDone, finishNow, DONE_PAD);
  $('btnSave').addEventListener('click', doSave);
  $('btnShare').addEventListener('click', doShare);
  onTap($('btnMute'), () => { muted = !muted; try { localStorage.setItem(SAVE_MUTE, muted ? '1' : '0'); } catch (e) { /* 無視 */ } renderMute(); if (!muted) { audioInit(); sfx.ui(); } });
  elName.addEventListener('input', () => { S.name = elName.value.slice(0, NAME_MAX); });
  elName.addEventListener('keydown', e => { if (e.key === 'Enter') elName.blur(); });

  /* ---------- メインループ ---------- */
  let lastT = now(), lastSig = '', idleN = 0, globeTick = 0;
  function frame() {
    requestAnimationFrame(frame);
    const t = now(), dt = Math.min(0.1, t - lastT); lastT = t; fit(dt);
    if (!S.w) return;
    if (S.cross > 0) S.cross = Math.max(0, S.cross - dt / 0.45);
    if (S.anim) animStep(t);
    if (S.next && t >= S.next.at) { const fn = S.next.fn; S.next = null; fn(); }
    if (S.screen === 'finish') finStep(t);
    // 何も動いていない間（カードを選んでいる間など）は、画面を描き直さない（電池を使わないように）
    const globeOn = () => S.screen === 'title' || (S.screen === 'result' && S.view !== 'map');      // 地球儀を見せている画面か（結果画面で「地図で見る」にしている間は、平面の地図）
    const moving = S.anim || S.morph || S.cross > 0 || S.shake > 0 || (S.screen !== 'play' && !(S.screen === 'result' && S.view === 'map')) || (S.fade && t - S.fade < 0.7) || (S.sel && S.ptr && !S.busy);
    const sig = S.screen + '|' + view.width + '|' + view.height + '|' + geo.fx.toFixed(1) + '|' + geo.fy.toFixed(1) + '|' + geo.fw.toFixed(1) + '|' + mapVer + '|' + (S.sel || '') + (S.ptr ? 1 : 0) + S.view;
    if (!moving && sig === lastSig && ++idleN < 45) return; lastSig = sig; idleN = 0;      // 止まっていても、念のため ときどきは描き直す
    if (globeOn() && !S.morph) { if (!S.drag) S.rot += SPIN * dt; if (!S.drag && (++globeTick & 1)) return; }      // ゆっくり回る地球儀は、1コマおきに描けば十分（計算を半分にする）
    vx.setTransform(DPR, 0, 0, DPR, 0, 0); vx.clearRect(0, 0, VW, VH);
    if (S.morph) {
      const m = S.morph, u = clamp((t - m.t0) / m.dur, 0, 1), k = easeIO(u), e = lerp(m.from, m.to, k);
      if (u >= 1) { S.morph = null; if (m.done) m.done(); else if (m.to === 1) toResult(); else beginPlay(); }
      else { drawMorph(e, m.from === 1 ? m.rot0 * (1 - k) : 0, m.from === 1 ? lerp(m.pitch, G.PITCH, E.smooth(0, 0.5, k)) : m.pitch); return; }      // ひらく時は、上下の傾きを先にいつもの向きへもどす（かたむいたまま ひらくと、形がわかりにくいため）
    }
    if (globeOn()) drawGlobe(t, 1);
    else if (S.screen !== 'boot') drawFlat(t, S.fade ? clamp((t - S.fade) / 0.5, 0, 1) : 1);
  }
  /* 準備運動：タイトルが出ている間に、重い計算を1回ずつ空回ししておく（最初のカードや「はじめる」で引っかからないように） */
  function warmUp() {
    const texts = () => {       // カードや案内で使う文字を、見えない所に1回並べておく（最初にカードを配る時に、字の準備で止まらないように）
      const d = document.createElement('div'); d.setAttribute('aria-hidden', 'true'); d.style.cssText = 'position:absolute;left:0;top:0;width:280px;height:10px;overflow:hidden;visibility:hidden;pointer-events:none;';
      const add = (cls, txt) => { const e = document.createElement('span'); e.className = cls; e.textContent = txt; d.appendChild(e); };
      add('card-name', C.LIST.map(c => c.name).join('')); add('card-desc', C.LIST.map(c => c.desc).join('')); add('card-tag', '場所をえらぶ世界ぜんたい2回目');
      add('hint', allHints().join('') + 'あと回'); add('award', T.LIST.map(t => t.name).join('')); add('award-desc', T.LIST.map(t => t.desc).join('') + CAP_NAME + '大きな山砂漠星の名前（つけなくてもOK）画像を保存シェアもう1回これで完成' + LAYERS.map(l => l[1]).join('') + LIFE_NAME.map(l => l[1]).join('') + '少ない多い寒い暑い雨が世界の人口およそ億人国（ぜんぶでか国）どの国でもない土地ほぼ0人1億人より国ができるほど、住みやすい土地がない');
      app.appendChild(d); void d.offsetWidth; setTimeout(() => d.remove(), 4000);
    };
    const steps = [texts, () => P.paint(S.w, loImg.data, 1, { riverFade: 0.5 }), () => E.climate(S.w), () => E.hydro(S.w), () => { const ev = C.make(S.w, 'uplift', 10, 10); ev.apply(0.5); ev.apply(0); E.climate(S.w); },
      () => { const fr = flatRect(), gg = globeGeom(), k = (MO - 10) / Math.max(fr.w, gg.R * 2); G.morph(mo32, MO, hi32, E.W * 2, E.H * 2, 0.5, 0, fr.w * k, gg.R * k, true); }, () => P.paint(S.w, loImg.data, 1), warmTilt];
    let i = 0; const run = () => { if (S.screen !== 'title' || i >= steps.length) return; try { steps[i++](); } catch (e) { /* 準備運動なので、失敗しても遊びには関係ない */ } setTimeout(run, 70); }; setTimeout(run, 350);
  }
  function boot() {
    renderMute(); getDownloads(); requestAnimationFrame(frame);
    setTimeout(() => { const m = /^#s(\d+)$/.exec(location.hash || ''); newWorld(m ? +m[1] : 0); setScreen('title'); $('btnStart').disabled = false; warmUp(); }, 40);
    try { if (document.fonts && document.fonts.load) { const all = C.LIST.map(c => c.name + c.desc).join('') + T.LIST.map(x => x.desc).join('') + allHints().join('');
      document.fonts.load('800 40px "Shippori Mincho B1"', GAME_TITLE + T.LIST.map(x => x.name).join('')).catch(() => {}); [500, 700, 900].forEach(wt => document.fonts.load(wt + ' 16px "Zen Kaku Gothic New"', all).catch(() => {})); } } catch (e) { /* 無視 */ }
  }
  boot();
  return { S, E, C, P, G, T, playCard, selectCard, deal, start, again, startFinish, skipFinish, newWorld, composeShare, shareText, flatRect, globeGeom, toScreen, markList, allHints, bandCanvas: () => bandCv, toggleView, finishNow, setLayer, LAYERS, LIFE_NAME, CAP_NAME, TURNS, HAND, MAX_USE };
})();
window.__eg = APP;
